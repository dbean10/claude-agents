name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontmatter on every agent
        run: |
          pip install pyyaml --quiet
          python3 <<'PYEOF'
          import re, sys
          from pathlib import Path
          import yaml

          errors = []
          for f in sorted(Path("global").glob("*.md")):
              text = f.read_text()
              m = re.match(r"^---\n(.+?)\n---\n", text, re.DOTALL)
              if not m:
                  errors.append(f"{f}: no frontmatter")
                  continue
              try:
                  meta = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  errors.append(f"{f}: invalid YAML — {e}")
                  continue
              if "name" not in meta:
                  errors.append(f"{f}: missing 'name'")
              if "description" not in meta:
                  errors.append(f"{f}: missing 'description'")
              if meta.get("name") != f.stem:
                  errors.append(f"{f}: name '{meta.get('name')}' does not match filename '{f.stem}'")

          if errors:
              print("FAILED:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print(f"✓ All {len(list(Path('global').glob('*.md')))} agent files validated")
          PYEOF
